name: d2c-analytics-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "15 2 * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preflight pipeline service health (optional)
        env:
          PIPELINE_SERVICE_URL: ${{ secrets.PIPELINE_SERVICE_URL }}
        run: |
          if [ -n "$PIPELINE_SERVICE_URL" ]; then
            python -m python.pipeline.check_service_health --pipeline-url "$PIPELINE_SERVICE_URL" --timeout-seconds 10
          fi
      - name: Prepare canonical raw data (CI fixture)
        run: |
          python -m python.pipeline.map_maven_fuzzy_factory \
            --input-dir data/raw/external/maven_fuzzy_factory \
            --output-dir data/raw \
            --allow-proxy-marketing-spend \
            --validation-mode warn

      - name: Run pipeline (CSV fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINE_SERVICE_URL: ${{ secrets.PIPELINE_SERVICE_URL }}
        run: |
          if [ -n "$PIPELINE_SERVICE_URL" ]; then
            if [ -n "$DATABASE_URL" ]; then
              python -m python.pipeline.run_pipeline --data-source postgres --database-url "$DATABASE_URL" --service-url "$PIPELINE_SERVICE_URL"
            else
              python -m python.pipeline.run_pipeline --data-source csv --service-url "$PIPELINE_SERVICE_URL"
            fi
          else
            if [ -n "$DATABASE_URL" ]; then
              python -m python.pipeline.run_pipeline --data-source postgres --database-url "$DATABASE_URL"
            else
              python -m python.pipeline.run_pipeline --data-source csv
            fi
          fi

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
